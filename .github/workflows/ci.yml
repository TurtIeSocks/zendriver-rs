name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # gpu-tier-gen's own output feeds back through rustfmt (see its
      # main.rs), so this job's rustfmt component doubles as this step's
      # runtime dependency.
      - name: GPU tier table is current
        run: |
          cargo run -p gpu-tier-gen
          git diff --exit-code crates/zendriver-stealth/src/gpu/tiers.rs

      # release-plz rewrites these files on every run with
      # `changelog_update = true`. That rewrite is only idempotent against
      # a well-formed file: on 2026-08-08 a rebase left a duplicated,
      # out-of-order heading in crates/zendriver/CHANGELOG.md, so every
      # run produced a diff, read the diff as an unreleased change, and cut
      # another version — 44 empty releases and 26 crates.io publishes
      # before anyone noticed. Nothing else in CI reads these files, so
      # this is the only thing standing between a bad merge and that loop.
      - name: Changelogs are well-formed
        run: |
          fail=0
          for f in CHANGELOG.md crates/*/CHANGELOG.md; do
            titles=$(grep -c '^# Changelog' "$f")
            if [ "$titles" -ne 1 ]; then
              echo "::error file=$f::expected exactly 1 '# Changelog' title block, found $titles"
              fail=1
            fi
            dups=$(grep -o '^## \[[^]]*\]' "$f" | sort | uniq -d)
            if [ -n "$dups" ]; then
              echo "::error file=$f::duplicate version headings: $(echo "$dups" | tr '\n' ' ')"
              fail=1
            fi
            vers=$(grep -o '^## \[[0-9][0-9.]*\]' "$f" | tr -d '#[] ')
            if [ -n "$vers" ] \
              && ! diff -q <(printf '%s\n' "$vers") <(printf '%s\n' "$vers" | sort -rV) >/dev/null; then
              echo "::error file=$f::version headings are not in descending order"
              fail=1
            fi
          done
          exit $fail

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # zendriver-fetcher's `cli` feature is off by default (library first),
      # so the sweep above never compiles the `zendriver-fetch` binary. Lint
      # it explicitly, or it rots unnoticed.
      - run: cargo clippy -p zendriver-fetcher --all-targets --features cli --locked -- -D warnings

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib --locked
      # `--lib` skips binaries, and the CLI's argument-contract tests live in
      # one — behind the same non-default `cli` feature.
      - run: cargo test -p zendriver-fetcher --bins --features cli --locked

  test-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --doc --locked

  # The only job that runs real-Chrome tests on more than one OS. Windows is
  # included deliberately: the Chrome *process lifecycle* (spawn, CDP
  # handshake, teardown of the process tree) is where this library's
  # platform-specific behavior actually lives, and it went untested on
  # Windows long enough to ship four lifecycle bugs. Kept to this job alone —
  # the nightly stealth/cloudflare/imperva suites stay Linux-only, since they
  # probe remote anti-bot services rather than OS process semantics and
  # Windows runner minutes bill at a premium.
  test-integration:
    strategy:
      # Windows is the newest, least-proven leg. A failure there must not
      # cancel the Linux run we depend on for signal.
      fail-fast: false
      matrix:
        include:
          # Linux is the reference platform: run everything.
          - os: ubuntu-latest
            filter: 'kind(test)'
          # Windows runs exactly ONE test binary, and that is deliberate —
          # though NOT for the reason this comment used to give.
          #
          # Corrected history. This filter was added on the theory that Chrome
          # on windows-latest cannot complete a loopback fetch from a
          # `wiremock::MockServer`, inferred from a first run that spent 4966s
          # (~83 min) with 4 wiremock-backed tests timing out. That theory was
          # WRONG, and the allowlist did not help: a later run had all 3
          # network-free `prerelease_verification` tests time out at 360s too,
          # having emitted nothing at all.
          #
          # The actual cause was `zendriver-stealth`'s Chrome version probe
          # exec'ing `chrome.exe --version` from inside `launch()`. Windows
          # Chrome has no POSIX print-and-exit for `--version` (upstream gates
          # it on `#if BUILDFLAG(IS_POSIX)`); with no existing browser session
          # to hand off to it starts a whole browser that never exits, and the
          # blocking `Command::output()` waits forever. Being a blocking call
          # inside the launch future, it also wedged the poll — which is why no
          # timeout ever fired and the hang was silent. EVERY test hung there,
          # before touching a socket. Fixed by reading the PE version resource
          # instead of executing anything.
          #
          # So loopback on this runner is UNVERIFIED, not broken — no test ever
          # got far enough to exercise it. Widening to `kind(test)` is now
          # plausible and worth measuring, but do it as its own change and watch
          # the clock: `.config/nextest.toml` bounds a hung test at 3 x 6 min,
          # which across 175 tests is still a job-budget fire if loopback does
          # turn out to be genuinely broken.
          #
          # Keeping the allowlist meanwhile is cheap and keeps this leg aimed at
          # what Windows is actually here for: `prerelease_verification` locks
          # the two genuinely OS-specific things — Chrome *discovery* (finding
          # chrome.exe at all) and the orphan/zombie process class from upstream
          # cdpdriver/zendriver#33 + #198, via
          # `repeated_launch_close_leaves_no_orphan_chrome_processes`, which
          # launches real Chrome 25x and diffs the system PID set.
          - os: windows-latest
            filter: 'binary_id(zendriver::prerelease_verification)'
    runs-on: ${{ matrix.os }}
    # Backstop only -- the per-test `slow-timeout` in .config/nextest.toml is
    # what actually names a stuck test. This exists so a hang that escapes it
    # (or a wedged compile) cannot ride the 6h default; Windows minutes bill
    # at 2x. Linux runs this in ~2m; Windows needs room for a cold compile
    # with an empty rust-cache, so 90m is deliberately generous rather than
    # tight -- a timeout here should mean "something is wrong", never "the
    # runner was slow today".
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Ensure Chrome available (preinstalled or apt fallback)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Using preinstalled $(google-chrome --version) at $(command -v google-chrome)"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "Using preinstalled $(google-chrome-stable --version) at $(command -v google-chrome-stable)"
          elif command -v chromium-browser >/dev/null 2>&1; then
            echo "Using preinstalled $(chromium-browser --version) at $(command -v chromium-browser)"
          else
            echo "No Chrome/Chromium found on PATH — falling back to apt install"
            sudo apt-get update
            sudo apt-get install -y chromium-browser
            chromium-browser --version
          fi
      # windows-latest ships Google Chrome preinstalled, so there is no
      # install fallback to make. Assert it up front anyway: if the runner
      # image ever drops it, fail here with a clear reason instead of as an
      # opaque discovery error inside every test.
      - name: Ensure Chrome available (preinstalled)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) {
            Write-Host "::error::No chrome.exe in any location zendriver discovers."
            $candidates | ForEach-Object { Write-Host "  looked in: $_" }
            exit 1
          }
          $version = (Get-Item $chrome).VersionInfo.ProductVersion
          Write-Host "Using preinstalled Chrome $version at $chrome"
      - run: cargo nextest run --workspace --features integration-tests --locked --profile ci-integration -E '${{ matrix.filter }}'

  # `zendriver-fetcher` is the one crate whose unit tests encode OS-specific
  # *path* semantics rather than browser behaviour, and until now none of them
  # ran on Windows: `test-unit` is ubuntu-only, and the Windows leg of
  # `test-integration` is filtered to a single `zendriver` binary.
  #
  # Two fixes shipped on reasoning alone because of that gap, both invisible
  # from Linux or macOS by construction:
  #  - `resolve_target` in `extract.rs` is reachable only from the
  #    `#[cfg(unix)]` symlink arm, so on Windows it is an unreferenced function
  #    and the workspace's `-D warnings` turned that into a hard build failure.
  #    It was caught only because `test-integration`'s Windows leg happens to
  #    compile the crate on the way to a `zendriver` test.
  #  - Asset names are rejected when they contain `:`, because a
  #    drive-relative name like `C:evil` has no separator to catch yet
  #    `Path::join` DISCARDS the base for it on Windows -- the same escape as
  #    `..`, reached without a `..`.
  #
  # No browser is launched here and no Chrome is needed, which is why this is
  # its own job rather than another leg of `test-integration`: it has no
  # business inheriting that job's 90-minute budget or its Chrome setup. It is
  # also NOT the widening of that leg's filter discussed above -- that remains
  # its own change, for the reasons documented there.
  test-fetcher-windows:
    runs-on: windows-latest
    # One crate and its dependencies, not the workspace, and the tests
    # themselves are offline and finish in under a second. This budget is
    # almost entirely a cold compile against an empty rust-cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--lib --bins` in one invocation: the CLI's argument-contract tests
      # live in a binary, behind the same non-default `cli` feature. The
      # workflow-wide `RUSTFLAGS: -D warnings` is what makes this also catch
      # the dead-code class that only appears once `cfg(unix)` is false.
      - run: cargo test -p zendriver-fetcher --lib --bins --features cli --locked

  # The only check that puts this repo's WebGL/WebGPU spoofing in front of a
  # real browser. Everything else guarding it -- the tier-table unit tests, the
  # `gpu-tier-gen` regeneration diff in `fmt`, the hand-written Node model of
  # Blink -- compares generated artifacts against each other, so all of them
  # stay green when the tables and an actual browser disagree. Only this job
  # can see that disagreement, which is why it blocks instead of reporting
  # amber.
  #
  # Until now it ran only inside `nightly-ignored-tests`, which carries
  # `continue-on-error: true` -- so a genuine table-versus-browser divergence
  # produced an ignorable yellow dot on a cron run and merged anyway. Promoted
  # as its own job rather than by dropping that lane's `continue-on-error`:
  # the nightly deliberately sweeps every `#[ignore]` test across two crates,
  # several of which probe live anti-bot services and are allowed to flake.
  #
  # Scoped to two binaries, both of which talk to a LOCAL Chrome and nothing
  # else -- no Cloudflare, no Imperva, no egress at all. That is what makes
  # these gate-worthy where the other nightly suites are not:
  #  - `gpu_profile` is the payload: it reads the spoofed surface out of a real
  #    browser and compares it against the committed tier captures.
  #  - `gpu_backend` is the foundation those captures rest on. Its canary pins
  #    ANGLE's SwiftShader constants, and if Chrome moves them every tier table
  #    derived from them is stale -- exactly the state that must not merge. The
  #    constants were measured on macOS (Chrome 150.0.7871.186) and re-measured
  #    identical on Linux (Debian Chromium 150.0.7871.181, aarch64): the
  #    renderer *string* differs, all four numbers do not. Crossing both OS and
  #    arch without moving is the evidence that these are ANGLE's constants
  #    rather than one host's. Its `Native` test, meanwhile, takes the
  #    documented `GpuBackendUnavailable` skip on a GPU-less Linux host --
  #    verified, not assumed. Accepted trade-off: a Chrome bump in
  #    the runner image can turn this red on an unrelated PR. That is the canary
  #    working rather than misfiring -- the fix is re-deriving the tables, which
  #    has to happen either way, and finding out at PR time beats finding out
  #    from a fingerprinter.
  #
  # This runner has no GPU, so the two `GpuBackend::Native` tests in
  # `gpu_profile` take their documented skip (`GpuBackendUnavailable`, which
  # they assert -- any other launch error still fails). What actually runs is
  # the SwiftShader path under a Mac-pinned persona: a SwiftShader browser
  # claiming Apple Metal, which is precisely the disagreement the tables exist
  # to survive.
  #
  # `--run-ignored ignored-only` because every test in both binaries is
  # `#[ignore]`d (they launch Chrome), and `--features integration-tests`
  # because both files are `#![cfg(feature = "integration-tests")]`.
  test-gpu-coherence:
    runs-on: ubuntu-latest
    # Backstop only, same role as `test-integration`'s: the per-test
    # `slow-timeout` in .config/nextest.toml is what names a stuck test. The 7
    # tests themselves run in seconds; this budget is almost entirely a cold
    # compile against an empty rust-cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Ensure Chrome available (preinstalled or apt fallback)
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Using preinstalled $(google-chrome --version) at $(command -v google-chrome)"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "Using preinstalled $(google-chrome-stable --version) at $(command -v google-chrome-stable)"
          elif command -v chromium-browser >/dev/null 2>&1; then
            echo "Using preinstalled $(chromium-browser --version) at $(command -v chromium-browser)"
          else
            echo "No Chrome/Chromium found on PATH — falling back to apt install"
            sudo apt-get update
            sudo apt-get install -y chromium-browser
            chromium-browser --version
          fi
      - run: cargo nextest run -p zendriver --features integration-tests --run-ignored ignored-only --locked --profile ci-integration -E 'binary(gpu_profile) or binary(gpu_backend) or binary(gpu_catalogue)'

  # Aggregate gate. The branch ruleset requires a status check named exactly
  # `test-integration`; a matrix job never provides one, because GitHub appends
  # the matrix values to the job name. So the legs above report as
  # `test-integration (ubuntu-latest, kind(test))` and
  # `test-integration (windows-latest, binary_id(...))`, and the bare name
  # simply does not exist.
  #
  # Converting `test-integration` from a single job into a matrix (0d83a585)
  # therefore deleted the very check the ruleset requires, deadlocking every PR
  # that carries the change: both legs go green, and the merge stays blocked
  # forever on "Expected — Waiting for status to be reported". This job restores
  # that name.
  #
  # Prefer this over pinning the ruleset to the expanded leg names, which
  # re-breaks the moment any matrix value changes — and the windows `filter` is
  # expected to change if that leg is ever widened to `kind(test)`.
  #
  # `test-gpu-coherence` is folded in here for a related reason. A red job only
  # blocks a merge if the ruleset requires its name, and editing the ruleset is
  # not something a PR can do — so a standalone job would report red and still
  # be mergeable, which is the same "visible but ignorable" failure mode it was
  # promoted out of. Routing it through the one name the ruleset already
  # requires makes it genuinely blocking today. If it is later added to the
  # ruleset under its own name, drop it from `needs` here so the two do not
  # report the same failure twice.
  #
  # `test-fetcher-windows` is folded in on exactly that reasoning — it is the
  # only job that can observe the fetcher's Windows path handling, so it being
  # red-but-mergeable would defeat the point of adding it.
  test-integration-gate:
    name: test-integration
    needs: [test-integration, test-gpu-coherence, test-fetcher-windows]
    # Not stylistic. Without `always()`, a FAILED leg skips this job, and a
    # skipped check never reports a failure — the gate would fall silent in
    # exactly the case it exists to catch, which is worse than no gate at all.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every integration leg to have succeeded
        run: |
          set -euo pipefail
          matrix='${{ needs.test-integration.result }}'
          gpu='${{ needs.test-gpu-coherence.result }}'
          fetcher='${{ needs.test-fetcher-windows.result }}'
          echo "test-integration matrix aggregate result: ${matrix}"
          echo "test-gpu-coherence result: ${gpu}"
          echo "test-fetcher-windows result: ${fetcher}"
          # For a matrix dependency this is `success` only when EVERY leg
          # succeeded. Treat everything else -- failure, cancelled, and skipped
          # -- as blocking: a leg that silently stops running must not read as
          # a pass. Same rule for the other jobs, which are plain rather than
          # matrices but earn no more leniency for it.
          #
          # Blocking on all of them is not the same as EXPLAINING all of them
          # identically. A job that ran and failed has a verdict, and naming the
          # likely cause is the useful thing to print. A job that was cancelled
          # or skipped produced no verdict at all, and asserting a cause there
          # is actively misleading -- "the tier tables disagreed" sent a reader
          # off to regenerate tables that had never been checked, when the real
          # story was a GitHub outage cancelling the runner mid-queue.
          report() {
            if [ "$2" = 'failure' ]; then
              echo "::error::$1 failed — $3"
            else
              echo "::error::$1 produced no verdict (result=$2) — re-run it. Not running is not a pass, but it is also not evidence that anything is broken."
            fi
          }

          failed=0
          if [ "${matrix}" != 'success' ]; then
            report 'test-integration matrix' "${matrix}" 'a real-Chrome integration test broke on at least one OS'
            failed=1
          fi
          if [ "${gpu}" != 'success' ]; then
            report 'test-gpu-coherence' "${gpu}" 'the spoofed GPU surface disagreed with the committed tier tables in a real browser, or the ANGLE canary drifted'
            failed=1
          fi
          if [ "${fetcher}" != 'success' ]; then
            report 'test-fetcher-windows' "${fetcher}" "the fetcher's path handling differs on Windows and no other job can see it"
            failed=1
          fi
          # Report ALL of them before exiting, so one failure does not hide another.
          exit "${failed}"

  nightly-stealth-tests:
    if: github.event_name == 'schedule' && github.event.schedule == '0 6 * * *'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Ensure Chrome available (preinstalled or apt fallback)
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Using preinstalled $(google-chrome --version) at $(command -v google-chrome)"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "Using preinstalled $(google-chrome-stable --version) at $(command -v google-chrome-stable)"
          elif command -v chromium-browser >/dev/null 2>&1; then
            echo "Using preinstalled $(chromium-browser --version) at $(command -v chromium-browser)"
          else
            echo "No Chrome/Chromium found on PATH — falling back to apt install"
            sudo apt-get update
            sudo apt-get install -y chromium-browser
            chromium-browser --version
          fi
      - run: cargo nextest run --workspace --features stealth-tests --test stealth_phase2 --locked --profile ci-integration

  nightly-cloudflare-tests:
    if: github.event_name == 'schedule' && github.event.schedule == '0 7 * * *'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Ensure Chrome available (preinstalled or apt fallback)
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Using preinstalled $(google-chrome --version) at $(command -v google-chrome)"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "Using preinstalled $(google-chrome-stable --version) at $(command -v google-chrome-stable)"
          elif command -v chromium-browser >/dev/null 2>&1; then
            echo "Using preinstalled $(chromium-browser --version) at $(command -v chromium-browser)"
          else
            echo "No Chrome/Chromium found on PATH — falling back to apt install"
            sudo apt-get update
            sudo apt-get install -y chromium-browser
            chromium-browser --version
          fi
      - run: cargo nextest run --workspace --features cloudflare-tests --test cloudflare_phase5 --locked --profile ci-integration

  nightly-imperva-tests:
    if: github.event_name == 'schedule' && github.event.schedule == '0 8 * * *'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Install Chromium
        run: sudo apt-get update && sudo apt-get install -y chromium-browser
      - run: cargo nextest run --workspace --features imperva-tests --test imperva_v0 --locked --profile ci-integration

  # Runs the rotting `#[ignore]` real-Chrome tests that no other job
  # exercises — 43 tests across `zendriver`/`zendriver-mcp` as of 2026-07-19,
  # silently un-run since the day they were written (see backlog §3, "43
  # `#[ignore]` integration tests ... No CI job runs them"). Modeled on
  # `nightly-stealth-tests`: same real-Chrome setup, `--profile
  # ci-integration`, `continue-on-error: true` (a scheduled monitor, not a PR
  # gate — never added to `test-integration-gate`'s `needs:`).
  #
  # Seven of those tests — `gpu_profile` and `gpu_backend` — no longer depend on
  # this lane: they were promoted to the blocking `test-gpu-coherence` job above
  # once it became clear that the one check able to catch a table-versus-browser
  # divergence could not fail a PR. They are deliberately left in this filter as
  # well. The duplication is a few seconds, and running them on cron keeps the
  # early warning for a Chrome bump that moves ANGLE's constants — which shows
  # up here the night before it starts blocking PRs.
  #
  # `--run-ignored ignored-only` selects ONLY `#[ignore]`d tests; everything
  # else in the workspace is already covered by `test-integration` on every
  # PR. The `-E` filter excludes, each for a documented reason:
  #  - External-network *binaries*, already covered by their own nightly
  #    lanes (real anti-bot services, not OS process semantics — see the
  #    `test-integration` comment above): `stealth_phase2` (nightly-stealth,
  #    cron `0 6`), `cloudflare_phase5` (nightly-cloudflare, cron `0 7`),
  #    `imperva_v0` (nightly-imperva, cron `0 8`). `zendriver-mcp`'s
  #    `integration_cloudflare`/`integration_imperva` hit the same external
  #    services from the MCP side and have no nightly lane of their own yet —
  #    excluded for the same external-dependency reason rather than left to
  #    flake against live Cloudflare/Imperva challenges.
  #  - Two individual external-network tests (not whole binaries):
  #    `end_to_end_install_chrome_to_tempdir` downloads a real Chrome build
  #    (belongs on a dedicated fetcher-network lane, not this one) and
  #    `end_to_end_cookies_storage_lifecycle` navigates httpbin.org +
  #    example.com with `wait_for: idle` (real egress, not a code bug).
  #  - The two dialog tests (`expect_dialog_resolves_on_alert` and
  #    `zendriver-mcp`'s `end_to_end_dialog_accept`) were excluded here while
  #    believed to need a "per-tab dialog-routing override". Fixed 2026-07-19:
  #    the real bug was `expect_dialog` subscribing to a non-existent CDP
  #    event `Page.javascriptDialogOpened` (Chrome fires `...Opening`), so the
  #    expectation always timed out on real Chrome while the mock unit test —
  #    firing the same wrong name — stayed green and hid it. Both pass now and
  #    are no longer excluded.
  #  - `random_canvas_differs_across_reads` was investigated 2026-07-19 and
  #    excluded pending that investigation (see backlog §3 at the time). Fixed
  #    2026-07-19 (four stacked defects: missing `.stealth(StealthProfile::
  #    spoofed())`, isolated- vs main-world reads, an install-race closed at
  #    the test level via poll-until-active, and a page-wide-advancing farble
  #    PRNG made content-keyed — see backlog §-closed "Random canvas strategy"
  #    for the full writeup). The test is renamed
  #    `random_canvas_stable_within_page` (chosen semantics: `Strategy::Random`
  #    is stable across repeat reads within one page load, since the PRNG seed
  #    — random per page load — is now keyed together with the read content)
  #    and no longer excluded here.
  nightly-ignored-tests:
    if: github.event_name == 'schedule' && github.event.schedule == '0 9 * * *'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Ensure Chrome available (preinstalled or apt fallback)
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Using preinstalled $(google-chrome --version) at $(command -v google-chrome)"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "Using preinstalled $(google-chrome-stable --version) at $(command -v google-chrome-stable)"
          elif command -v chromium-browser >/dev/null 2>&1; then
            echo "Using preinstalled $(chromium-browser --version) at $(command -v chromium-browser)"
          else
            echo "No Chrome/Chromium found on PATH — falling back to apt install"
            sudo apt-get update
            sudo apt-get install -y chromium-browser
            chromium-browser --version
          fi
      - run: cargo nextest run --workspace --features integration-tests --run-ignored ignored-only --locked --profile ci-integration -E 'not (binary(stealth_phase2) or binary(cloudflare_phase5) or binary(imperva_v0) or binary(integration_cloudflare) or binary(integration_imperva) or test(end_to_end_install_chrome_to_tempdir) or test(end_to_end_cookies_storage_lifecycle))'

