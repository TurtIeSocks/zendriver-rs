name: Release PR

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-plz-pr
  cancel-in-progress: false

jobs:
  release-plz-pr:
    name: Update release PR
    runs-on: ubuntu-latest
    # Never react to release-plz's own merge landing on main. The
    # auto-merge step below uses the PAT, so unlike a GITHUB_TOKEN push
    # it *does* retrigger this workflow — which closes a cycle:
    # open release PR -> auto-merge -> push -> open release PR. The only
    # thing normally breaking it is release-plz finding nothing to
    # release on the second pass, and on 2026-08-08 that failed: a
    # malformed crates/zendriver/CHANGELOG.md made `changelog_update`
    # non-idempotent, so every pass produced a diff, read it as an
    # unreleased change, and cut another version. 44 empty releases and
    # 26 crates.io publishes later, the workflow had to be disabled by
    # hand. Publishing still happens — release-plz-release.yml is what
    # listens for the release merge.
    #
    # Matches both shapes the merge can take: a squash ("chore: release")
    # and a merge commit ("Merge pull request #N from …/release-plz-…").
    if: >-
      !startsWith(github.event.head_commit.message, 'chore: release') &&
      !contains(github.event.head_commit.message, '/release-plz-')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: release-plz/action@v0.5.129
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Auto-merge the release PR so publishing stays hands-off: the
      # merge pushes "chore: release ..." to main, which triggers
      # release-plz-release.yml to publish to crates.io.
      #
      # GH_TOKEN is the PAT, not GITHUB_TOKEN — a GITHUB_TOKEN-authored
      # push would NOT trigger the release workflow (GitHub's anti-
      # recursion rule). The PAT-authored merge does.
      #
      # `gh pr merge --auto` queues the merge behind required status
      # checks when branch protection defines them. main is currently
      # unprotected (no required checks), and GitHub refuses to *enable*
      # auto-merge on an already-mergeable PR — so the `|| gh pr merge`
      # fallback merges immediately. Add branch protection with required
      # checks later and the --auto path will gate on green CI with no
      # further changes here.
      # Second line of defence, independent of why a release PR appeared.
      # A release that changes no crate version is by definition a no-op, and
      # it was this loop's own tell: 15 consecutive changelog-only "releases"
      # ran while nothing was watching for exactly that shape. Refuse to merge
      # one, and leave the run red so a human sees it.
      - name: Refuse a release PR that bumps no version
        if: ${{ steps.release-plz.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          PR_NUMBER: ${{ fromJSON(steps.release-plz.outputs.pr).number }}
        run: |
          if ! gh pr diff "$PR_NUMBER" --name-only | grep -q 'Cargo\.toml$'; then
            echo "::error::release PR #$PR_NUMBER changes no Cargo.toml version."
            echo "::error::That is the no-op release shape that looped on 2026-08-08."
            gh pr close "$PR_NUMBER" \
              --comment "Closed automatically: this release PR bumps no crate version." || true
            exit 1
          fi

      - name: Auto-merge the release PR
        if: ${{ steps.release-plz.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          PR_NUMBER: ${{ fromJSON(steps.release-plz.outputs.pr).number }}
        run: |
          gh pr merge --auto --merge "$PR_NUMBER" \
            || gh pr merge --merge "$PR_NUMBER"
