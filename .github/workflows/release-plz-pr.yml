name: Release PR

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-plz-pr
  cancel-in-progress: false

jobs:
  release-plz-pr:
    name: Update release PR
    runs-on: ubuntu-latest
    # Never react to release-plz's own merge landing on main. The
    # auto-merge step below uses the PAT, so unlike a GITHUB_TOKEN push
    # it *does* retrigger this workflow — which closes a cycle:
    # open release PR -> auto-merge -> push -> open release PR. The only
    # thing normally breaking it is release-plz finding nothing to
    # release on the second pass, and on 2026-08-08 that failed: a
    # malformed crates/zendriver/CHANGELOG.md made `changelog_update`
    # non-idempotent, so every pass produced a diff, read it as an
    # unreleased change, and cut another version. 44 empty releases and
    # 26 crates.io publishes later, the workflow had to be disabled by
    # hand. Publishing still happens — release-plz-release.yml is what
    # listens for the release merge.
    #
    # Matches both shapes the merge can take: a squash ("chore: release")
    # and a merge commit ("Merge pull request #N from …/release-plz-…").
    if: >-
      !startsWith(github.event.head_commit.message, 'chore: release') &&
      !contains(github.event.head_commit.message, '/release-plz-')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: release-plz/action@v0.5.129
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Second line of defence, independent of why a release PR appeared.
      # A release that changes no crate version is by definition a no-op, and
      # it was this loop's own tell: 15 consecutive changelog-only "releases"
      # ran while nothing was watching for exactly that shape.
      #
      # Block the MERGE, do not close the PR. The same changelog-only shape is
      # also produced legitimately, by a hand-edited version -- release-plz
      # then has nothing left to bump and opens a PR carrying only the
      # changelog entry. Closing that one on 2026-08-18 cost the 0.5.25
      # heading, and a changelog drifting from what actually published is the
      # condition that started the loop in the first place. Leaving it open and
      # red puts a human in front of the decision instead of guessing which
      # case this is.
      - name: Refuse to auto-merge a release PR that bumps no version
        id: noop-guard
        if: ${{ steps.release-plz.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          PR_NUMBER: ${{ fromJSON(steps.release-plz.outputs.pr).number }}
        run: |
          if ! gh pr diff "$PR_NUMBER" --name-only | grep -q 'Cargo\.toml$'; then
            echo "::error::release PR #$PR_NUMBER bumps no crate version, so it will not be auto-merged."
            echo "::error::That is the no-op shape that looped on 2026-08-08 -- and also what a"
            echo "::error::hand-edited version leaves behind. Left open for a human: merge it if the"
            echo "::error::changelog entry is wanted, close it if this is a loop."
            exit 1
          fi

      # Auto-merge the release PR so publishing stays hands-off: the
      # merge pushes "chore: release ..." to main, which triggers
      # release-plz-release.yml to publish to crates.io.
      #
      # GH_TOKEN is the PAT, not GITHUB_TOKEN — a GITHUB_TOKEN-authored
      # push would NOT trigger the release workflow (GitHub's anti-
      # recursion rule). The PAT-authored merge does.
      #
      # `gh pr merge --auto` queues the merge behind required status
      # checks. main's ruleset has defined five of them (fmt, clippy,
      # test-unit, test-doc, test-integration) since 2026-05-27, so the
      # --auto path is the one that runs and the `|| gh pr merge`
      # fallback is a leftover for the unprotected case.
      #
      # Do not read that gate as protection against a runaway loop. The
      # 2026-08-08 incident merged 44 release PRs straight through it —
      # each one waited its full ~7 minutes for green CI and got it,
      # because an empty release genuinely passes every check. Required
      # checks answer "is this branch broken", never "should this exist";
      # that question is the job of the job-level `if:` and the no-op step above.
      - name: Auto-merge the release PR
        if: ${{ steps.release-plz.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          PR_NUMBER: ${{ fromJSON(steps.release-plz.outputs.pr).number }}
        run: |
          gh pr merge --auto --merge "$PR_NUMBER" \
            || gh pr merge --merge "$PR_NUMBER"
