[workspace]
resolver = "3"
members = [
    "crates/zendriver",
    "crates/zendriver-transport",
    "crates/zendriver-stealth",
    "crates/zendriver-cloudflare",
    "crates/zendriver-interception",
    "crates/zendriver-fetcher",
    "crates/zendriver-mcp",
    "crates/zendriver-imperva",
    "crates/zendriver-datadome",
    "crates/zendriver-fingerprints",
    "crates/locale-gen",
    "crates/gpu-tier-gen",
    "crates/gpu-catalogue-gen",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TurtIeSocks/zendriver-rs"
authors = ["zendriver-rs contributors"]

[workspace.dependencies]
# Internal
zendriver               = { path = "crates/zendriver", version = "0.5.7", default-features = false }
zendriver-transport     = { path = "crates/zendriver-transport", version = "0.2.6" }
zendriver-stealth       = { path = "crates/zendriver-stealth", version = "0.12.4" }
zendriver-cloudflare    = { path = "crates/zendriver-cloudflare", version = "0.2.14" }
zendriver-interception  = { path = "crates/zendriver-interception", version = "0.3.18" }
zendriver-fetcher       = { path = "crates/zendriver-fetcher", version = "0.2.1" }
zendriver-mcp           = { path = "crates/zendriver-mcp", version = "0.16.16" }
zendriver-imperva       = { path = "crates/zendriver-imperva", version = "0.3.4" }
zendriver-datadome      = { path = "crates/zendriver-datadome", version = "0.1.21" }
zendriver-fingerprints  = { path = "crates/zendriver-fingerprints", version = "0.3.19" }

# MCP server
# Pinned exactly, matching proxybroker-rs: rmcp's macro and transport surface moves across
# releases. proxybroker already pins `=2.2.0`, so a project depending on both crates is held
# to 2.2.0 regardless — a looser range here would buy nobody freedom, only a second copy.
# Relax in both repos together or not at all.
# rmcp-macros dropped: 2.x ships the macros behind rmcp's own `macros` feature, and no crate
# ever depended on it directly.
rmcp        = { version = "=2.2.0", default-features = false }
schemars    = "1.0"
clap        = { version = "4", features = ["derive"] }
axum        = { version = "0.7" }

# External — runtime
tokio              = { version = "1.40",  features = ["full"] }
tokio-util         = { version = "0.7",   features = ["rt"] }
tokio-tungstenite  = { version = "0.24" }
tokio-stream       = { version = "0.1",   features = ["sync"] }
futures            = { version = "0.3" }
async-trait        = { version = "0.1" }

# External — CDP
chromiumoxide_cdp  = { version = "0.7" }

# External — serde
serde              = { version = "1",     features = ["derive"] }
serde_json         = { version = "1" }

# External — errors / logging
thiserror          = { version = "2" }
tracing            = { version = "0.1" }

# External — utilities
url                = { version = "2" }
percent-encoding   = { version = "2" }
tempfile           = { version = "3" }
sysinfo            = { version = "0.32", default-features = false, features = ["system"] }
num_cpus           = "1"
regex              = "1"
bitflags           = "2"
unicode-segmentation = "1"
rand               = { version = "0.9", default-features = false, features = ["std", "std_rng", "small_rng", "os_rng"] }
base64             = "0.22"
# 0.13, matching proxybroker-rs so a project using both compiles one HTTP stack.
#
# `rustls-no-provider`, NOT `rustls`: the latter enables `__rustls-aws-lc-rs`, whose -sys
# C/asm crate is the musl cross-compile blocker. 0.12 wired a provider in for you via the
# feature name (`rustls-tls` -> `__rustls-ring`); 0.13 stopped guessing, so the provider is
# now installed explicitly at startup — see `install_default_crypto_provider`. Getting that
# wrong is a RUNTIME panic ("no process-level CryptoProvider available"), not a build error.
#
# Roots come from `rustls-platform-verifier`, which `rustls-no-provider` pulls in. proxybroker
# additionally enables reqwest's `webpki-roots` for bundled roots because it ships a FROM-scratch
# image with no OS trust store; that optional dependency was dropped after reqwest 0.13.1, so
# asking for it here would pin us below the latest patch for no benefit.
reqwest            = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip", "deflate", "stream"] }
# Direct dep purely to name the ring provider in `install_default_crypto_provider`.
rustls             = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
zip                = { version = "2",    default-features = false, features = ["deflate"] }
sha2               = "0.10"
dirs               = "5"
glob               = "0.3"
uuid               = { version = "1",     features = ["v4"] }
psl                = "2"

# Dev-deps
tokio-test         = { version = "0.4" }
wiremock           = { version = "0.6" }
insta              = { version = "1",     features = ["yaml", "json"] }
serial_test        = { version = "3" }
tracing-subscriber = { version = "0.3",   features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
todo          = "warn"
unimplemented = "warn"
panic         = "warn"
